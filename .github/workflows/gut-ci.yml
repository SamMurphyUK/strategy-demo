name: GUT CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  gut-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: game-ci/godot-action@v2
        with:
          godot-version: '4.6.2'
          export-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Run GUT integration tests
        run: |
          godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/integration \
            -gexit \
            -ginclude_subdirs \
            2>&1 | tee gut.log

      - name: Run demo smoke (seed 12345)
        run: |
          godot --headless --path . -s res://scripts/demo_smoke_runner.gd \
            -- --seed=12345 --output=/tmp/smoke_result.json \
            2>&1 | tee smoke.log
          cat /tmp/smoke_result.json

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            gut.log
            smoke.log
            /tmp/smoke_result.json

  nightly-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: game-ci/godot-action@v2
        with:
          godot-version: '4.6.2'
          export-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Nightly smoke alternate seed
        run: |
          godot --headless --path . -s res://scripts/demo_smoke_runner.gd \
            -- --seed=99999 --output=/tmp/smoke_nightly.json
          cat /tmp/smoke_nightly.json

      - name: Upload nightly artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-logs
          path: /tmp/smoke_nightly.json
