name: GUT CI

# Manual only. Day-to-day checks are web-ci.yml (Vitest and the Vite build).
on:
  workflow_dispatch:

jobs:
  gut-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
          sudo ln -sf /tmp/godot/Godot_v4.6.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Verify Godot
        run: godot --version

      # The Godot project lives in legacy/godot. Its res:// content is the shared
      # copy at the repo root, staged beside it for this run only.
      - name: Stage shared content
        run: |
          cp -r data docs demomap01.json legacy/godot/
          cp -r art/loose/png/. legacy/godot/

      - name: Import project
        run: godot --headless --import --path legacy/godot --quit

      - name: Run GUT integration tests
        run: |
          godot --headless --path legacy/godot -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/integration \
            -gexit \
            -ginclude_subdirs \
            2>&1 | tee gut.log

      - name: Run demo smoke (seed 12345)
        run: |
          godot --headless --path legacy/godot -s res://scripts/demo_smoke_runner.gd \
            -- --seed=12345 --output=/tmp/smoke_result.json \
            2>&1 | tee smoke.log
          cat /tmp/smoke_result.json

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            gut.log
            smoke.log
            /tmp/smoke_result.json
